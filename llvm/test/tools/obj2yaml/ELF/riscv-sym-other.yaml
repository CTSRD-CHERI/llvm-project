## Check RISC-V st_other extension support.

# RUN: yaml2obj %s -o %t
# RUN: obj2yaml %t | FileCheck %s

# CHECK: Symbols:
# CHECK:  - Name:  foo1
# CHECK:    Other: [ STO_RISCV_VARIANT_CC ]
# CHECK:  - Name:  foo2
# CHECK:    Other: [ STO_RISCV_VARIANT_CC, 32 ]
# CHECK:  - Name:  foo3
# CHECK:    Other: [ STO_RISCV_CHERI_DONT_SEAL ]
# CHECK:  - Name:  foo4
# CHECK:    Other: [ STO_RISCV_CHERI_DONT_SEAL, 32 ]

--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_REL
  Machine: EM_RISCV
Symbols:
  - Name:  foo1
    Other: [ STO_RISCV_VARIANT_CC ]
  - Name:  foo2
    Other: [ STO_RISCV_VARIANT_CC, 0x20 ]
  - Name:  foo3
    Other: [ STO_RISCV_CHERI_DONT_SEAL ]
  - Name:  foo4
    Other: [ STO_RISCV_CHERI_DONT_SEAL, 0x20 ]
